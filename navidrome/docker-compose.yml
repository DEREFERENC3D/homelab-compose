services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    environment:
      ND_ENABLEINSIGHTSCOLLECTOR: false
      ND_ENABLETRANSCODINGCONFIG: true
    volumes:
      - ./volumes/navidrome/data:/data
      - ./volumes/navidrome/music:/music
      - ./volumes/navidrome/libraries:/libraries
      - ./volumes/navidrome/nextcloud:/nextcloud
    networks:
      default:
        ipv4_address: 10.1.11.2


networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 10.1.11.0/24
          gateway: 10.1.11.1
