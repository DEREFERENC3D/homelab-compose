version: '3'

services:
  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    env_file:
      - run.env
      - path: run.env.local
        required: false
    volumes:
      - ./volumes/synapse/data:/data
    depends_on:
      - db
#    ports:
#      - 8448:8448/tcp
    networks:
      default:
        ipv4_address: 10.1.16.2
  db:
    image: docker.io/postgres:15-alpine
    restart: unless-stopped
    env_file:
      - db_run.env
      - path: db_run.env.local
        required: false
    volumes:
      - ./volumes/db/var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 10.1.16.3

  element-web:
    image: docker.io/vectorim/element-web
    restart: unless-stopped
    env_file:
      - element_run.env
      - path: element_run.env.local
        required: false
    volumes:
      - ./volumes/element-web/app/config.json:/app/config.json:ro
    depends_on:
      - synapse
#    ports:
#      - 8080:8080/tcp
    networks:
      default:
        ipv4_address: 10.1.16.4

  ketesa:
    image: docker.io/etkecc/ketesa
    restart: unless-stopped
    volumes:
      - ./volumes/ketesa/var/public/config.json:/var/public/config.json:ro
    depends_on:
      - synapse
#    healthcheck:
#      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/config.json >/dev/null 2>&1 || exit 1"]
#      interval: 5s
#      timeout: 5s
    networks:
      default:
        ipv4_address: 10.1.16.5

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 10.1.16.0/24
          gateway: 10.1.16.1
